<body><main class="public-shell"><nav class="public-nav"><div class="brand"><div class="logo">AG</div><div><h2>A-GRID</h2><p>Contratti self-service</p></div></div><div class="actions"><a class="btn secondary" href="/app/wallet.html">Wallet</a><a class="btn secondary" href="/farmer/">Farmer</a></div></nav>

<script>const data={mrv:['Impegno pratiche rigenerative','Attivo','5 anni','Monitoraggio IoT+satellite'],broker:['A-Grid vende per conto farmer','Bozza','15% fee','Exit volontario sempre'],direct:['Buyer compra NFT carbon credit','Pending','Wallet-to-wallet','Polygonscan link']};function tab(k,b){document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const d=data[k];contractBody.innerHTML='<h2>'+d[0]+'</h2><div class="grid three"><div><b>Stato</b><p>'+d[1]+'</p></div><div><b>Termini</b><p>'+d[2]+'</p></div><div><b>Note</b><p>'+d[3]+'</p></div></div><div class="mini-actions"><button class="btn">Firma</button><button class="btn secondary" onclick="alert(\\'Pagamento: farmer 75%, fee 15%, buffer 10%\\')">Pagamento trasparente</button></div>'}tab('mrv',document.querySelector('.tabbar button'));</script></body></html>
